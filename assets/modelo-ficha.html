<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha — Luxsandoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700;800&family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Marcellus&family=Pirata+One&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   FICHA JOGÁVEL — LUXSANDORIA
   Cores: vêm da magia do personagem (paleta do sistema), injetadas em
   --ac/--ac2/--f1/--f2. Arquitetura: body[data-arq] muda moldura,
   tipografia dos títulos e posição do retrato.
   ===================================================================== */
:root {
    --ac: #58A0C8; --ac2: #58A0C8; --f1: #113F67; --f2: #081e33; --metal: #d7b66d;
    --vida: #d8424f; --vida-2: #8e1d2b; --alerta: #ff6b6b;
    --tinta: #efe9dc; --tinta-2: #b9b2a4; --tinta-3: #8d877b;
    --painel: rgba(6, 8, 14, .42); --painel-2: rgba(255, 255, 255, .045);
    --linha: color-mix(in srgb, var(--ac) 34%, transparent);
    --linha-metal: color-mix(in srgb, var(--metal) 45%, transparent);
    --titulo: 'Cinzel', Georgia, serif;
    --dados: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
    --prosa: 'Alegreya', Georgia, serif;
    --r: 10px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body { overflow-x: clip; }
body {
    margin: 0; color: var(--tinta); font: 400 16px/1.5 var(--dados);
    background:
        radial-gradient(1200px 700px at 30% -10%, color-mix(in srgb, var(--f1) 92%, var(--ac) 8%), transparent 70%),
        radial-gradient(900px 600px at 100% 100%, color-mix(in srgb, var(--f1) 70%, transparent), transparent 70%),
        var(--f2);
    background-attachment: fixed; min-height: 100vh;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.g { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- barra superior ---------- */
.topo {
    position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px;
    padding: 8px clamp(10px, 3vw, 28px); background: color-mix(in srgb, var(--f2) 86%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--linha);
}
.topo .marca { display: flex; align-items: center; gap: 8px; min-width: 0; font-family: var(--titulo); color: var(--metal); }
.topo .marca span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo .marca svg { font-size: 1.3rem; color: var(--ac); }
.mini-vida { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; opacity: 0; pointer-events: none; transition: opacity .2s; }
.mini-vida.vis { opacity: 1; pointer-events: auto; }
.mini-vida .barra { flex: 1; max-width: 360px; height: 10px; }
.mini-vida b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.topo .acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.estado { font-size: .82rem; color: var(--tinta-2); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.estado::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #6fcf97; }
.estado.sujo::before { background: #f2c14e; }
.estado.erro::before { background: var(--alerta); }

.bt {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px;
    border: 1px solid var(--linha-metal); background: rgba(255,255,255,.04); padding: 7px 12px;
    font-weight: 700; font-size: .86rem; color: var(--tinta); white-space: nowrap; transition: background .15s, border-color .15s;
}
.bt:hover { background: rgba(255,255,255,.09); border-color: var(--metal); }
.bt.forte { background: var(--ac); border-color: var(--ac); color: #0b0b0d; }
.bt.forte:hover { background: color-mix(in srgb, var(--ac) 82%, white); }
.bt.ic { padding: 6px; width: 32px; height: 32px; }
.bt.ic svg { font-size: 1rem; }
.bt.mini { padding: 4px 9px; font-size: .78rem; }
.bt.perigo:hover { border-color: var(--alerta); color: var(--alerta); }
.bt:disabled { opacity: .45; cursor: default; }

/* ---------- folha ---------- */
.folha { max-width: 1240px; margin: 0 auto; padding: clamp(14px, 3vw, 34px) clamp(10px, 3vw, 28px) 80px; }

/* Cabeçalho: retrato + painel de combate */
.cabeca { display: grid; grid-template-columns: minmax(260px, 400px) minmax(0, 1fr); gap: clamp(18px, 3vw, 40px); align-items: start; }
body[data-arq="gotico"] .cabeca { grid-template-columns: minmax(0, 1fr) minmax(260px, 400px); }
body[data-arq="gotico"] .cabeca .retrato-col { order: 2; }
body[data-arq="mistico"] .cabeca { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
body[data-arq="mistico"] .combate { width: 100%; max-width: 860px; text-align: left; }

.retrato-col { position: relative; width: 100%; }
.moldura { position: relative; aspect-ratio: 3 / 4; padding: 7px; background: linear-gradient(160deg, var(--metal), color-mix(in srgb, var(--metal) 40%, #000) 60%, var(--metal)); }
.moldura .arte { position: absolute; inset: 7px; overflow: hidden; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--ac) 30%, var(--f1)), var(--f2)); }
.moldura img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
.moldura .sem-arte { width: 100%; height: 100%; display: grid; place-items: center; font-size: 7rem; color: color-mix(in srgb, var(--ac) 60%, transparent); }
.moldura .arte::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 60px rgba(0,0,0,.55); pointer-events: none; }
.canto { position: absolute; width: 34px; height: 34px; color: var(--metal); z-index: 2; display: grid; place-items: center; font-size: 15px; }
.canto::before { content: ''; position: absolute; inset: 0; border: 2px solid var(--metal); }
.canto.c1 { top: -6px; left: -6px; } .canto.c1::before { border-right: 0; border-bottom: 0; }
.canto.c2 { top: -6px; right: -6px; } .canto.c2::before { border-left: 0; border-bottom: 0; }
.canto.c3 { bottom: -6px; left: -6px; } .canto.c3::before { border-right: 0; border-top: 0; }
.canto.c4 { bottom: -6px; right: -6px; } .canto.c4::before { border-left: 0; border-top: 0; }
.canto svg { opacity: .7; }
.medalhao {
    position: absolute; left: 50%; top: -22px; translate: -50% 0; z-index: 3; width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center; font-size: 26px; color: var(--metal);
    background: radial-gradient(circle, color-mix(in srgb, var(--ac) 35%, var(--f2)), var(--f2));
    border: 2px solid var(--metal); box-shadow: 0 0 0 4px var(--f2), 0 0 22px color-mix(in srgb, var(--ac) 50%, transparent);
}
.medalhao.suprema { width: 62px; height: 62px; top: -28px; font-size: 32px; box-shadow: 0 0 0 4px var(--f2), 0 0 0 6px var(--ac), 0 0 30px var(--ac); }

/* grimório: janela em arco */
body[data-arq="grimorio"] .moldura, body[data-arq="grimorio"] .moldura .arte { border-radius: 50% 50% 6px 6px / 26% 26% 6px 6px; }
body[data-arq="grimorio"] .canto.c1, body[data-arq="grimorio"] .canto.c2 { display: none; }
/* gótico: ogiva */
body[data-arq="gotico"] .moldura, body[data-arq="gotico"] .moldura .arte { clip-path: polygon(50% 0, 100% 16%, 100% 100%, 0 100%, 0 16%); }
body[data-arq="gotico"] .canto.c1, body[data-arq="gotico"] .canto.c2 { display: none; }
body[data-arq="gotico"] .medalhao { top: -30px; }
/* metal: chanfro com rebites */
body[data-arq="metal"] .moldura, body[data-arq="metal"] .moldura .arte { clip-path: polygon(7% 0, 93% 0, 100% 5%, 100% 95%, 93% 100%, 7% 100%, 0 95%, 0 5%); }
body[data-arq="metal"] .moldura { background:
    radial-gradient(circle, var(--metal) 2px, transparent 2.5px) 0 0 / 22px 22px,
    linear-gradient(160deg, color-mix(in srgb, var(--metal) 70%, #222), #1b1b1f 55%, color-mix(in srgb, var(--metal) 70%, #222)); padding: 10px; }
body[data-arq="metal"] .moldura .arte { inset: 10px; }
body[data-arq="metal"] .canto { display: none; }
/* místico: círculo dentro de um diagrama */
body[data-arq="mistico"] .retrato-col { width: min(380px, 80vw); }
body[data-arq="mistico"] .moldura { aspect-ratio: 1; border-radius: 50%; }
body[data-arq="mistico"] .moldura .arte { border-radius: 50%; }
body[data-arq="mistico"] .canto { display: none; }
.diagrama { position: absolute; inset: -12%; pointer-events: none; color: var(--metal); opacity: .5; display: none; }
body[data-arq="mistico"] .diagrama { display: block; animation: girar 160s linear infinite; }
@keyframes girar { to { rotate: 360deg; } }

.ident { margin: 0 0 14px; }
body[data-arq="mistico"] .ident { text-align: center; margin-top: 22px; }
.titulo-pers { font-family: var(--titulo); color: var(--ac); letter-spacing: .06em; font-size: 1.05rem; margin: 0 0 2px; }
.nome {
    font-family: var(--titulo); font-weight: 700; color: var(--tinta); margin: 0; line-height: 1.02;
    font-size: clamp(2rem, 4.6vw, 3.6rem); letter-spacing: .01em; text-wrap: balance;
    text-shadow: 0 2px 24px color-mix(in srgb, var(--ac) 45%, transparent);
}
.linhagem { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 10px; color: var(--tinta-2); font-size: .98rem; }
body[data-arq="mistico"] .linhagem { justify-content: center; }
.linhagem .li { display: inline-flex; align-items: center; gap: 6px; }
.linhagem .li svg { color: var(--metal); font-size: 1.05rem; }
.rank-selo {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 6px; font-weight: 800; letter-spacing: .04em;
    color: #0b0b0d; background: linear-gradient(120deg, var(--ac), var(--ac2), var(--ac)); background-size: 300% 100%;
}
body[data-animado="1"] .rank-selo { animation: fluxo 5s linear infinite; }
@keyframes fluxo { to { background-position: 300% 0; } }
.principais { display: inline-flex; gap: 6px; }
.principais span { border: 1px solid; border-radius: 6px; padding: 1px 9px; font-size: .82rem; font-weight: 700; background: rgba(0,0,0,.3); }

/* ---------- painéis ---------- */
.painel { position: relative; background: var(--painel); border: 1px solid var(--linha); border-radius: var(--r); padding: 16px; }
body[data-arq="grimorio"] .painel { outline: 1px solid color-mix(in srgb, var(--metal) 22%, transparent); outline-offset: 3px; }
body[data-arq="gotico"] .painel { border-radius: 2px; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%, 0 14px); border-top: 2px solid var(--ac); }
body[data-arq="metal"] .painel { border-radius: 4px; border-color: var(--linha-metal); background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 40px), var(--painel); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--metal) 40%, transparent); }
body[data-arq="mistico"] .painel { border-radius: 18px; }

/* ---------- combate ---------- */
.combate { display: grid; gap: 14px; }
.vida-painel { padding: 18px 18px 16px; border-color: color-mix(in srgb, var(--vida) 45%, transparent); }
.rec-cab { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rec-nome { font-family: var(--titulo); font-size: 1.05rem; color: var(--tinta-2); margin: 0; display: flex; align-items: center; gap: 7px; }
.vida-painel .rec-nome svg { color: var(--vida); }
.numeros { margin-left: auto; display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; }
.num { background: transparent; border: 1px solid transparent; border-radius: 6px; text-align: right; padding: 0 4px; width: 3.4ch; -moz-appearance: textfield; }
.num::-webkit-inner-spin-button, .num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.num:hover, .num:focus { border-color: var(--linha); background: rgba(0,0,0,.25); }
.vida-painel .num.atual { font: 800 clamp(2.6rem, 6vw, 3.6rem)/1 var(--dados); color: #fff; width: 4.2ch; }
.vida-painel .num.max { font: 700 1.5rem/1 var(--dados); color: var(--tinta-2); width: 3.6ch; text-align: left; }
.vida-painel .barra-div { font-size: 1.5rem; color: var(--tinta-3); }
.barra { position: relative; height: 20px; border-radius: 999px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.08); overflow: hidden; margin: 12px 0 10px; }
.barra .enche { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: inherit; transition: width .35s ease; background: linear-gradient(90deg, var(--vida-2), var(--vida)); box-shadow: 0 0 16px color-mix(in srgb, var(--vida) 60%, transparent); }
.barra .marca13 { position: absolute; top: 0; bottom: 0; left: 33.33%; width: 2px; background: rgba(255,255,255,.35); }
.vida-painel.baixa .enche { background: repeating-linear-gradient(-45deg, var(--vida), var(--vida) 10px, var(--vida-2) 10px, var(--vida-2) 20px); animation: pulsar 1.2s ease-in-out infinite alternate; }
.vida-painel.baixa { box-shadow: 0 0 0 1px var(--vida), 0 0 28px color-mix(in srgb, var(--vida) 35%, transparent); }
.vida-painel.zero .num.atual { color: var(--alerta); }
@keyframes pulsar { from { opacity: 1; } to { opacity: .55; } }
.aviso-vida { font-size: .86rem; color: #ffb4b4; min-height: 1.3em; margin: 0 0 8px; }
.controles { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.controles .grupo { display: inline-flex; border: 1px solid var(--linha-metal); border-radius: 8px; overflow: hidden; }
.controles .grupo button { background: rgba(255,255,255,.03); border: 0; padding: 6px 10px; font-weight: 800; min-width: 38px; font-variant-numeric: tabular-nums; }
.controles .grupo button + button { border-left: 1px solid var(--linha-metal); }
.controles .grupo button:hover { background: rgba(255,255,255,.1); }
.controles .rot { font-size: .78rem; color: var(--tinta-3); margin-right: 2px; }
.rapido { display: inline-flex; gap: 4px; margin-left: auto; }
.rapido input { width: 70px; background: rgba(0,0,0,.35); border: 1px solid var(--linha-metal); border-radius: 8px; padding: 6px 8px; text-align: center; }
.rapido .dano { border-color: color-mix(in srgb, var(--vida) 60%, transparent); }
.rapido .cura { border-color: color-mix(in srgb, #6fcf97 60%, transparent); }

.recursos-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.recurso .num.atual { font: 800 1.9rem/1 var(--dados); color: #fff; }
.recurso .num.max { font: 700 1.05rem/1 var(--dados); color: var(--tinta-2); text-align: left; }
.recurso .barra { height: 12px; margin: 10px 0 10px; }
.recurso.magica .enche { background: repeating-linear-gradient(90deg, var(--ac) 0 18px, color-mix(in srgb, var(--ac) 55%, #000) 18px 20px); box-shadow: 0 0 14px color-mix(in srgb, var(--ac) 55%, transparent); }
.recurso.magica .rec-nome svg { color: var(--ac); }
.recurso.mag .enche { background: linear-gradient(90deg, color-mix(in srgb, var(--ac2) 60%, #000), var(--ac2)); }
.recurso.mag .rec-nome svg { color: var(--ac2); }
.recurso .rec-nome { font-size: .95rem; }

.selos { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.selo { text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--painel-2); border: 1px solid var(--linha); }
.selo .v { font: 800 1.35rem/1.1 var(--dados); color: var(--ac); font-variant-numeric: tabular-nums; }
.selo .r { font-size: .74rem; color: var(--tinta-2); }

.cond-cab { display: flex; align-items: center; gap: 10px; }
.cond-cab .rec-nome { margin-right: auto; }
.conds { display: grid; gap: 8px; margin-top: 10px; }
.conds:empty::before { content: 'Nenhuma condição ativa.'; color: var(--tinta-3); font-size: .88rem; }
.cond { border: 1px solid color-mix(in srgb, var(--alerta) 40%, transparent); border-left: 3px solid var(--alerta); background: rgba(80, 10, 16, .25); border-radius: 8px; padding: 9px 11px; }
.cond.grave { border-left-color: #ff3048; background: rgba(110, 8, 20, .32); }
.cond.especial { border-left-color: var(--ac); border-color: var(--linha); background: var(--painel-2); }
.cond-topo { display: flex; align-items: center; gap: 8px; }
.cond-topo strong { font-size: 1rem; }
.cond-topo small { color: var(--tinta-3); }
.cond-topo .bt { margin-left: auto; }
.cond p { margin: 4px 0 6px; font: .9rem/1.45 var(--prosa); color: var(--tinta); }
.cond input { width: 100%; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 4px 8px; font-size: .84rem; }

/* ---------- seções ---------- */
.secao { margin-top: 38px; }
.secao-cab { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
.secao-cab h2 { font-family: var(--titulo); font-weight: 700; font-size: clamp(1.3rem, 2.4vw, 1.7rem); margin: 0; color: var(--tinta); letter-spacing: .02em; }
.secao-cab .sig { color: var(--ac); font-size: 1.4rem; }
.secao-cab .fio { flex: 1; height: 1px; background: linear-gradient(90deg, var(--linha-metal), transparent); }
.secao-cab .bt { flex: none; }
.divisor { display: flex; align-items: center; gap: 14px; margin: 42px auto 0; color: var(--metal); max-width: 520px; }
.divisor::before, .divisor::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--linha-metal), transparent); }
.divisor svg { font-size: 1.5rem; opacity: .8; }
.vazio { color: var(--tinta-3); font-size: .9rem; padding: 6px 2px; }

/* atributos */
.atributos { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.atr { position: relative; text-align: center; padding: 12px 6px 10px; border-radius: var(--r); border: 1px solid; background: rgba(0,0,0,.28); }
.atr .r { font-size: .86rem; font-weight: 800; letter-spacing: .02em; }
.atr .v { font: 800 2.1rem/1.1 var(--dados); color: #fff; font-variant-numeric: tabular-nums; }
.atr .b { font-size: .76rem; color: var(--tinta-2); min-height: 1.2em; }
.atr.temp { border-style: dashed; }
.atr .delta { position: absolute; top: 6px; right: 6px; font-size: .74rem; font-weight: 800; border-radius: 5px; padding: 0 5px; background: rgba(0,0,0,.5); }
.pos { color: #8fe0a0; } .neg { color: #ff9a9a; }
.temps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.temp-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px dashed var(--linha-metal); border-radius: 8px; padding: 4px 6px 4px 10px; font-size: .86rem; background: rgba(0,0,0,.25); }
.temp-chip .d { color: var(--tinta-2); }
.temp-chip button { background: none; border: 0; color: var(--tinta-3); padding: 2px 5px; border-radius: 4px; }
.temp-chip button:hover { color: var(--alerta); }

/* cartões (ataques, poderes, itens, pensamentos) */
.lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.cartao { position: relative; border-radius: var(--r); padding: 13px 14px 12px; background: var(--painel); border: 1px solid rgba(255,255,255,.09); border-left: 3px solid var(--cor, var(--ac)); }
body[data-arq="metal"] .cartao { border-radius: 4px; }
body[data-arq="gotico"] .cartao { border-radius: 2px; }
.cartao-topo { display: flex; align-items: flex-start; gap: 8px; }
.cartao h3 { font-family: var(--titulo); font-size: 1.08rem; margin: 0; line-height: 1.2; flex: 1; min-width: 0; }
.etiqueta { display: inline-block; font-size: .72rem; font-weight: 800; color: #0b0b0d; background: var(--cor, var(--ac)); border-radius: 4px; padding: 1px 7px; margin-bottom: 6px; }
.rk { font-size: .72rem; color: var(--tinta-2); border: 1px solid rgba(255,255,255,.15); border-radius: 4px; padding: 0 6px; margin-left: 4px; }
.cartao .ferr { display: flex; gap: 2px; opacity: .55; transition: opacity .15s; }
.cartao:hover .ferr, .cartao:focus-within .ferr { opacity: 1; }
@media (hover: none) { .cartao .ferr { opacity: 1; } }
.ferr button { background: none; border: 0; color: var(--tinta-2); width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; }
.ferr button:hover { background: rgba(255,255,255,.08); color: var(--tinta); }
.ferr button.rm:hover { color: var(--alerta); }
.efeito { font: .93rem/1.55 var(--prosa); color: #e2dccf; margin-top: 6px; overflow-wrap: anywhere; }

// Arrastar: o cartão se move dentro do fluxo (sem flutuar por cima dos outros)
let arrasto = null;
document.addEventListener('pointerdown', (e) => {
    const alca = e.target.closest('[data-alca]'); if (!alca || e.button > 0) return;
    e.preventDefault();
    const card = alca.closest('.cartao');
    arrasto = { card, id: e.pointerId };
    card.classList.add('arrastando'); document.body.classList.add('movendo');
    alca.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', (e) => {
    if (!arrasto || e.pointerId !== arrasto.id) return;
    const sob = document.elementFromPoint(e.clientX, e.clientY);
    const alvo = sob && sob.closest('#poderes .cartao');
    if (!alvo || alvo === arrasto.card) { autoRolar(e.clientY); return; }
    const r = alvo.getBoundingClientRect();
    const depois = (e.clientY - r.top) > r.height / 2 || (Math.abs(e.clientY - (r.top + r.height / 2)) < r.height / 4 && e.clientX > r.left + r.width / 2);
    alvo.parentNode.insertBefore(arrasto.card, depois ? alvo.nextSibling : alvo);
    autoRolar(e.clientY);
});
function autoRolar(y) { if (y < 80) scrollBy(0, -14); else if (y > innerHeight - 60) scrollBy(0, 14); }
function soltar() {
    if (!arrasto) return;
    arrasto.card.classList.remove('arrastando'); document.body.classList.remove('movendo');
    aplicarOrdemPoderes($$('#poderes .cartao').map(c => int(c.dataset.poder)));
    arrasto = null;
}
document.addEventListener('pointerup', soltar);
document.addEventListener('pointercancel', soltar);
function aplicarOrdemPoderes(novaOrdemVis) {
    const atual = visiveis().map(x => x.i);
    if (novaOrdemVis.join() === atual.join()) return;
    const objs = novaOrdemVis.map(i => ch.poderes[i]);
    const novo = ch.poderes.slice(); let k = 0;
    ch.poderes.forEach((p, i) => { if (!p.oculto) novo[i] = objs[k++]; });   // ocultos mantêm a posição
    ch.poderes = novo; mudou(); renderPoderes();
}
document.addEventListener('keydown', (e) => {
    const alca = e.target.closest && e.target.closest('[data-alca]');
    if (!alca || !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    e.preventDefault();
    const ordem = visiveis().map(x => x.i), pos = ordem.indexOf(int(alca.dataset.alca));
    const alvo = pos + (e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? -1 : 1);
    if (alvo < 0 || alvo >= ordem.length) return;
    [ordem[pos], ordem[alvo]] = [ordem[alvo], ordem[pos]];
    const idMovido = ch.poderes[int(alca.dataset.alca)];
    aplicarOrdemPoderes(ordem);
    const novo = $$('#poderes [data-alca]').find(a => ch.poderes[int(a.dataset.alca)] === idMovido);
    if (novo) novo.focus();
});

const LISTA = { atq: () => ch.ataques, poder: () => ch.poderes, item: () => ch.inventario, pens: () => ch.pensamentos };
const RENDER = { atq: renderAtaques, poder: renderPoderes, item: renderInventario, pens: renderPensamentos };
const ROTULO = { atq: 'ataque', poder: 'poder', item: 'item', pens: 'registro' };

// =====================================================================
//  EVENTOS

document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-acao]'); if (!t) return;
    const d = t.dataset;
    if (d.vida) return setVida(vidaAtual() + int(d.vida));
    if (d.vidamax) return setVidaMax(vidaMax() + int(d.vidamax));
    if (d.rec) return ajustarRecurso(d.rec, valorRecurso(d.rec) + int(d.d));
    if (d.encher) return ajustarRecurso(d.encher, d.encher === 'vmag' ? (ch.vidaMagicaMax || 0) : magMax());
    if (d.rmCond != null) { ch.condicoes.splice(int(d.rmCond), 1); mudou(); return renderConds(); }
    if (d.rmTempAtr != null) { ch.temporarios.atributos.splice(int(d.rmTempAtr), 1); mudou(); renderAtributos(); renderPericias(); return renderAtaques(); }
    if (d.rmTempPer != null) { ch.temporarios.pericias.splice(int(d.rmTempPer), 1); mudou(); return renderPericias(); }
    if (d.editar) return editar(d.editar, int(d.i));
    if (d.duplicar) { const l = LISTA[d.duplicar](), o = JSON.parse(JSON.stringify(l[int(d.i)])); o.nome = (o.nome || '') + ' (cópia)'; l.splice(int(d.i) + 1, 0, o); mudou(); return RENDER[d.duplicar](); }
    if (d.remover) {
        const l = LISTA[d.remover](), it = l[int(d.i)];
        if (!confirm('Remover o ' + ROTULO[d.remover] + ' "' + (it.nome || it.assunto || '') + '"?')) return;
        l.splice(int(d.i), 1); mudou(); return RENDER[d.remover]();
    }
    if (d.qtd != null) { const it = ch.inventario[int(d.qtd)]; it.qtd = Math.max(0, (it.qtd || 1) + int(d.d)); if (it.qtd === 0 && !confirm('Quantidade zerada. Remover "' + it.nome + '" do inventário?')) it.qtd = 1; else if (it.qtd === 0) ch.inventario.splice(int(d.qtd), 1); mudou(); return renderInventario(); }
    if (d.carga != null) { const c = ch.cargas[int(d.carga)]; c.atual = Math.max(0, (c.atual || 0) + int(d.d)); if (c.max > 0) c.atual = Math.min(c.atual, c.max); mudou(); return renderCargas(); }
    if (d.rmCarga != null) { if (!confirm('Remover a carga "' + ch.cargas[int(d.rmCarga)].nome + '"?')) return; ch.cargas.splice(int(d.rmCarga), 1); mudou(); return renderCargas(); }
    if (d.fechar != null) return fecharDialogo();
    const acoes = {
        'restaurar': () => setVida(vidaMax()),
        'dano': () => { const v = int($('#v-rapido').value); if (v > 0) { setVida(vidaAtual() - v); toast('−' + v + ' de Vida'); } },
        'cura': () => { const v = int($('#v-rapido').value); if (v > 0) { setVida(vidaAtual() + v); toast('+' + v + ' de Vida'); } },

        'add-carga': () => { if (ch.cargas.length >= (S.maxCargas || 9)) return toast('Limite de ' + (S.maxCargas || 9) + ' cargas.', true); ch.cargas.push({ nome: 'Nova carga', atual: 0, max: 0 }); mudou(); renderCargas(); }
    };
    if (d.acao && acoes[d.acao]) acoes[d.acao]();

document.addEventListener('change', (e) => {
    const t = e.target, d = t.dataset;
    if (d.campo === 'vida') return setVida(int(t.value));
    if (d.campo === 'vidamax') return setVidaMax(int(t.value, 1));
    if (['vmag', 'vmagmax', 'mag', 'magmax'].includes(d.campo)) return ajustarRecurso(d.campo, int(t.value));
    if (d.notaCond != null) { ch.condicoes[int(d.notaCond)].nota = t.value; return mudou(); }
    if (d.cargaNome != null) { ch.cargas[int(d.cargaNome)].nome = t.value.trim() || 'Carga'; return mudou(); }
    if (d.cargaAtual != null) { const c = ch.cargas[int(d.cargaAtual)]; c.atual = Math.max(0, int(t.value)); if (c.max > 0) c.atual = Math.min(c.atual, c.max); mudou(); return renderCargas(); }
    if (d.cargaMax != null) { const c = ch.cargas[int(d.cargaMax)]; c.max = Math.max(0, int(t.value)); if (c.max > 0 && c.atual > c.max) c.atual = c.max; mudou(); return renderCargas(); }
});
document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); salvar(); }
    if (e.key === 'Enter' && e.target.id === 'v-rapido') { e.preventDefault(); $('[data-acao="dano"]').click(); }
});

// ---------- diálogo ----------
const dlg = $('#dlg');
function abrirDialogo(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
function fecharDialogo() { if (dlg.open) dlg.close(); }
dlg.addEventListener('click', (e) => { if (e.target === dlg) fecharDialogo(); });

// =====================================================================
//  SALVAR E BAIXAR
// =====================================================================
function mudou() { sujo = true; const e = $('#estado'); e.className = 'estado sujo'; e.innerHTML = '<span>Alterações não salvas</span>'; }
function salvar() {
    try {
        localStorage.setItem(CHAVE, JSON.stringify({ em: Date.now(), ch }));
        sujo = false;
        const e = $('#estado'); e.className = 'estado'; e.innerHTML = '<span>Salvo às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + '</span>';
        toast('Ficha salva neste navegador.');
    } catch (err) {
        const e = $('#estado'); e.className = 'estado erro'; e.innerHTML = '<span>Erro ao salvar</span>';
        toast('Não consegui salvar neste navegador (armazenamento cheio ou bloqueado). Use "Baixar ficha" para guardar o progresso.', true);
    }
}
async function baixar() {
    const agora = new Date();
    const dados = JSON.parse(JSON.stringify(ch)); dados.atualizado = agora.toISOString();
    const sis = Object.assign({}, S, { exportado: agora.toISOString() });
    const json = (o) => JSON.stringify(o).replace(/</g, '\\u003c');
    const html = '<!DOCTYPE html>\n' + MOLDE
        .replace(/(<script type="application\/json" id="wnj-ficha">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json(dados) + b)
        .replace(/(<script type="application\/json" id="wnj-sistema">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json(sis) + b);
    const nome = (norm(nomeCompleto).replace(/[^a-z0-9]+/g, '_') || 'personagem') + '_' + agora.toISOString().slice(0, 10) + '.html';
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    try {
        if (window.showSaveFilePicker) {   // deixa a pessoa escolher onde salvar (e confirmar se for substituir)
            const h = await window.showSaveFilePicker({ suggestedName: nome, types: [{ description: 'Ficha HTML', accept: { 'text/html': ['.html'] } }] });
            const w = await h.createWritable(); await w.write(blob); await w.close();
        } else {
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
            document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        }
        salvar();
        toast('Ficha atualizada baixada como ' + nome + '.');
    } catch (err) {
        if (err && err.name === 'AbortError') return;
        toast('Não consegui gerar o arquivo: ' + err.message, true);
    }
}
$('#bt-salvar').onclick = salvar;
$('#bt-baixar').onclick = baixar;
window.addEventListener('beforeunload', (e) => { if (sujo) { e.preventDefault(); e.returnValue = ''; } });

function toast(msg, erro) {
    const t = document.createElement('div'); t.className = 'toast' + (erro ? ' erro' : ''); t.setAttribute('role', erro ? 'alert' : 'status'); t.textContent = msg;
    $('#toasts').appendChild(t); while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
    setTimeout(() => t.remove(), erro ? 6000 : 3200);
}

render();
})();
</script>
