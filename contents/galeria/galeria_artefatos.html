<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artefatos - Luxsandoria</title>
    <script>(function(){var m=document.cookie.match(/(?:^|; )theme=([^;]+)/);document.documentElement.setAttribute('data-theme', m?decodeURIComponent(m[1]):'blue');})();</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        :root { --c1: #113F67; --c2: #34699A; --c3: #58A0C8; --c4: #FDF5AA; }
        body { background-color: var(--c1) !important; color: var(--c4); }

        /* Estilos do Filtro */
        .filter-section {
            background: rgba(52, 105, 154, 0.2); padding: 20px; border-radius: 15px;
            border: 1px solid var(--c3); margin-bottom: 40px;
        }
        .filter-group { margin-bottom: 15px; }
        .filter-group label { display: block; font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--c3); text-transform: uppercase; margin-bottom: 8px; }

        .btn-filter {
            background: transparent; border: 1px solid var(--c3); color: var(--c3);
            margin: 2px; font-size: 0.8rem; padding: 5px 15px; border-radius: 20px; transition: 0.3s;
        }
        .btn-filter.active { background: var(--c4); color: var(--c1); border-color: var(--c4); }
        .btn-filter:hover { border-color: var(--c4); color: var(--c4); }

        /* Card 3:2 */
        .artifact-card {
            aspect-ratio: 3 / 2; background: var(--c2); border: 1px solid var(--c3); border-radius: 10px;
            overflow: hidden; position: relative; text-decoration: none; display: block; transition: 0.4s;
            background-size: cover; background-position: center;
        }
        .artifact-card:hover { transform: translateY(-5px); border-color: var(--c4); box-shadow: 0 0 20px rgba(253, 245, 170, 0.2); }

        /* Overlay para o texto ficar legível sobre a imagem de fundo */
        .artifact-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, var(--c1) 10%, rgba(17, 63, 103, 0.4) 50%, transparent);
        }

        .artifact-info {
            position: absolute; bottom: 0; width: 100%; padding: 15px; text-align: center; z-index: 2;
        }
        .artifact-name { color: var(--c4); font-family: 'Cinzel', serif; font-size: 1rem; margin: 0; text-shadow: 0 2px 4px #000; }
        .artifact-tag { font-size: 0.65rem; color: #fff; text-transform: uppercase; text-shadow: 0 1px 2px #000; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container py-5">
        <header class="text-center mb-5 position-relative">
            <h1 class="display-4" style="font-family: 'Cinzel', serif;">Arsenal de Relíquias</h1>
            <p style="color: var(--c3);">Filtre os tesouros de Luxsandoria.</p>
        </header>

        <section class="filter-section">
            <div class="filter-group">
                <label>Tipo de Item</label>
                <button class="btn-filter active" onclick="filterItems('all', this, 'type')">Tudo</button>
                <button class="btn-filter" onclick="filterItems('arma', this, 'type')">Armas</button>
                <button class="btn-filter" onclick="filterItems('acessorio', this, 'type')">Acessórios</button>
                <button class="btn-filter" onclick="filterItems('armadura', this, 'type')">Armaduras</button>
                <button class="btn-filter" onclick="filterItems('consumivel', this, 'type')">Consumíveis</button>
            </div>
            <div class="filter-group">
                <label>Raridade</label>
                <button class="btn-filter active" onclick="filterItems('all', this, 'rarity')">Tudo</button>
                <button class="btn-filter" onclick="filterItems('bizarro', this, 'rarity')">Bizarro</button>
                <button class="btn-filter" onclick="filterItems('mitica', this, 'rarity')">Mítica</button>
                <button class="btn-filter" onclick="filterItems('lendaria', this, 'rarity')">Lendária</button>
                <button class="btn-filter" onclick="filterItems('fabula', this, 'rarity')">Fábula</button>
                <button class="btn-filter" onclick="filterItems('epica', this, 'rarity')">Épica</button>
            </div>
        </section>

        <div id="gallery-loader" class="text-center my-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-2 text-muted">Consultando os Arquivos Akáshicos...</p>
        </div>

        <div class="row g-4" id="artifact-grid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- REPOSITÓRIO DE ORIGEM DA GALERIA ---
        const PUBLIC_USER = 'Lokeser';
        const PUBLIC_REPO = 'lokeser.github.io';
        // ----------------------------------------

        // --- SISTEMA DE LEITURA DA GALERIA (AUTO-GENERATION) ---
        document.addEventListener('DOMContentLoaded', loadGallery);

        async function loadGallery() {
            const grid = document.getElementById('artifact-grid');
            const loader = document.getElementById('gallery-loader');

            try {
                // 1. Listar arquivos na pasta
                const apiUrl = `https://api.github.com/repos/${PUBLIC_USER}/${PUBLIC_REPO}/contents/contents/galeria/artefatos`;
                const response = await fetch(apiUrl);

                if(!response.ok) throw new Error("Falha ao acessar repositório (verifique o limite de requisições do GitHub)");

                const files = await response.json();

                // 2. Processar cada arquivo Markdown
                for (const file of files) {
                    if (file.name.endsWith('.md')) {
                        processMarkdownFile(file.download_url, file.path, grid);
                    }
                }
            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="col-12 text-center text-danger"><p>Erro ao carregar o Grimório: ${error.message}</p></div>`;
            } finally {
                loader.style.display = 'none';
            }
        }

        async function processMarkdownFile(url, path, grid) {
            try {
                const response = await fetch(url);
                const text = await response.text();

                // 3. REGEX PARSING (A Mágica)
                const nameMatch = text.match(/^##\s+(.*)$/m);
                const name = nameMatch ? nameMatch[1].trim() : "Artefato Desconhecido";

                const typeMatch = text.match(/\*\*Tipo:\*\*\s*(.*?)(\.|$)/i);
                let type = typeMatch ? typeMatch[1].trim().toLowerCase() : "outro";
                type = type.replace(/[\W_]+/g,"");

                const rarityMatch = text.match(/\*\*Raridade:\*\*\s*(.*?)(\.|$)/i);
                let rarity = rarityMatch ? rarityMatch[1].trim().toLowerCase() : "bizarro";
                rarity = rarity.replace(/[\W_]+/g,"");

                const imgMatch = text.match(/!\[.*?\]\((.*?)\)/);
                let imgPath = "../../assets/images/placeholder.png";

                if (imgMatch) {
                    const rawPath = imgMatch[1];
                    const fileName = rawPath.split('/').pop();
                    imgPath = `../../assets/images/${fileName}`;
                }

                // 4. Criar o Card HTML
                const col = document.createElement('div');
                col.className = `col-6 col-md-4 col-lg-3 artifact-item`;
                col.setAttribute('data-type', type);
                col.setAttribute('data-rarity', rarity);

                const viewerLink = `../../viewer.html?file=${path}`;

                col.innerHTML = `
                    <a href="${viewerLink}" class="artifact-card" style="background-image: url('${imgPath}');">
                        <div class="artifact-overlay"></div>
                        <div class="artifact-info">
                            <h3 class="artifact-name">${name}</h3>
                            <span class="artifact-tag">${type.toUpperCase()} | ${rarity.toUpperCase()}</span>
                        </div>
                    </a>
                `;
                grid.appendChild(col);

            } catch (e) {
                console.warn("Erro ao processar item:", e);
            }
        }

        // --- SISTEMA DE FILTRO ---
        function filterItems(value, btn, category) {
            btn.parentElement.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const typeBtn = document.querySelector('.filter-group:nth-child(1) .btn-filter.active');
            const rarityBtn = document.querySelector('.filter-group:nth-child(2) .btn-filter.active');

            const currentType = typeBtn.getAttribute('onclick').match(/'([^']+)'/)[1];
            const currentRarity = rarityBtn.getAttribute('onclick').match(/'([^']+)'/)[1];

            const items = document.querySelectorAll('.artifact-item');
            items.forEach(item => {
                const itemType = item.getAttribute('data-type');
                const itemRarity = item.getAttribute('data-rarity');

                const typeMatch = (currentType === 'all' || itemType.includes(currentType));
                const rarityMatch = (currentRarity === 'all' || itemRarity.includes(currentRarity));

                if (typeMatch && rarityMatch) item.classList.remove('hidden');
                else item.classList.add('hidden');
            });
        }
    </script>
    <script src="../../js/menu.js"></script>
</body>
</html>
