<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador - Luxsandoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { 
            --c1: #113F67; /* Fundo Profundo */
            --c2: #34699A; /* Azul Médio */
            --c3: #58A0C8; /* Azul Claro */
            --c4: #FDF5AA; /* Amarelo Solar */
        }
        
        body { 
            background-color: var(--c1); 
            color: #e0e0e0; 
            font-family: 'Lato', sans-serif; /* Texto corrido mais legível */
            min-height: 100vh; 
            background-image: radial-gradient(circle at top, #1a4f7a 0%, var(--c1) 60%);
        }
        
        /* Container Principal (A Página do Grimório) */
        .content-container {
            background: rgba(17, 63, 103, 0.95);
            border: 1px solid var(--c3);
            border-top: 4px solid var(--c4); /* Detalhe dourado no topo */
            border-radius: 4px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-width: 900px;
            margin: 40px auto;
            position: relative;
        }

        /* --- TIPOGRAFIA SOLAR (Onde a mágica acontece) --- */
        
        /* Título Principal (H1) */
        #content h1 {
            font-family: 'Cinzel', serif;
            color: var(--c4);
            text-align: center;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(253, 245, 170, 0.3);
            border-bottom: 2px solid var(--c2);
            padding-bottom: 20px;
        }

        /* Subtítulos (H2, H3) */
        #content h2, #content h3 {
            font-family: 'Cinzel', serif;
            color: var(--c3);
            margin-top: 30px;
            margin-bottom: 15px;
            border-left: 4px solid var(--c4);
            padding-left: 15px;
            background: linear-gradient(90deg, rgba(52, 105, 154, 0.2) 0%, transparent 100%);
        }

        #content h2 { font-size: 1.8rem; color: var(--c4); }
        #content h3 { font-size: 1.4rem; }

        /* Destaques em Negrito (Status, Palavras-chave) */
        #content strong {
            color: var(--c4);
            font-weight: 700;
        }

        /* Imagens no Markdown */
        #content img {
            display: block;
            max-width: 100%; 
            height: auto; 
            border-radius: 4px; 
            border: 1px solid var(--c3);
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            margin: 30px auto;
        }

        /* Citações (Blockquotes) - Lore */
        #content blockquote {
            font-style: italic;
            color: var(--c3);
            border-left: 3px solid var(--c2);
            margin: 20px 0;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.2);
        }

        /* Listas */
        #content ul { margin-bottom: 20px; padding-left: 20px; }
        #content li { margin-bottom: 8px; line-height: 1.6; }
        #content li::marker { color: var(--c4); } /* Bolinha dourada */

        /* Linhas Horizontais */
        #content hr { border-color: var(--c3); opacity: 0.3; margin: 40px 0; }

        /* Links dentro do texto */
        #content a { color: var(--c4); text-decoration: none; border-bottom: 1px dotted var(--c4); transition: 0.3s; }
        #content a:hover { color: #fff; text-shadow: 0 0 5px var(--c4); }

        /* Controles do Administrador (Botões flutuantes) */
        #admin-controls {
            position: fixed; bottom: 30px; right: 30px; z-index: 1000;
            display: none;
        }
        .btn-admin {
            width: 55px; height: 55px; border-radius: 50%; margin-left: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: 0.3s;
            border: 2px solid var(--c3);
        }
        .btn-edit { background-color: var(--c1); color: var(--c4); }
        .btn-delete { background-color: #3e1111; color: #ff6b6b; border-color: #ff6b6b; }
        .btn-admin:hover { transform: translateY(-5px) scale(1.05); filter: brightness(1.2); }

        /* Modal Styles */
        .modal-content { background-color: var(--c1); border: 1px solid var(--c3); color: var(--c4); }
        .form-control, .form-select { 
            background-color: rgba(0,0,0,0.3); border: 1px solid var(--c2); color: white; 
        }
        .form-control:focus { background-color: rgba(0,0,0,0.5); color: white; border-color: var(--c4); box-shadow: 0 0 10px rgba(253, 245, 170, 0.2); }
    </style>
</head>
<body>

    <div class="container mt-4">
        <a href="javascript:history.back()" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>

    <div id="content" class="content-container">
        <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
        </div>
    </div>

    <div id="admin-controls">
        <div class="d-flex">
            <button class="btn btn-admin btn-delete" onclick="confirmDelete()" title="Excluir Arquivo">
                <i class="bi bi-trash"></i>
            </button>
            <button class="btn btn-admin btn-edit" onclick="openEditModal()" title="Editar Arquivo">
                <i class="bi bi-pencil"></i>
            </button>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Registro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" id="editName">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Subtítulo (Inglês)</label>
                                <input type="text" class="form-control" id="editSub">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Caminho da Imagem Atual</label>
                                <input type="text" class="form-control" id="editImgPath" readonly style="opacity: 0.7">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tipo</label>
                                <select class="form-select" id="editType">
                                    <option value="Arma">Arma</option>
                                    <option value="Acessório">Acessório</option>
                                    <option value="Armadura">Armadura</option>
                                    <option value="Consumível">Consumível</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Raridade</label>
                                <select class="form-select" id="editRarity">
                                    <option value="Bizarro">Bizarro</option>
                                    <option value="Mítica">Mítica</option>
                                    <option value="Lendária">Lendária</option>
                                    <option value="Fábula">Fábula</option>
                                    <option value="Épica">Épica</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Vinculado a</label>
                                <input type="text" class="form-control" id="editBind">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Descrição</label>
                                <textarea class="form-control" id="editDesc" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Efeitos (Markdown)</label>
                                <textarea class="form-control" id="editEffects" rows="8" style="font-family: monospace;"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning" onclick="saveChanges()">
                        <i class="bi bi-save"></i> Salvar Alterações
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/loader.js"></script>
</body>
</html>
