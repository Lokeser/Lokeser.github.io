<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador - Luxsandoria</title>
    <!-- Aplica o tema salvo antes da renderização (evita "flash") -->
    <script>(function(){var m=document.cookie.match(/(?:^|; )theme=([^;]+)/);document.documentElement.setAttribute('data-theme', m?decodeURIComponent(m[1]):'blue');})();</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { 
            --c1: #113F67; /* Fundo Profundo */
            --c2: #34699A; /* Azul Médio */
            --c3: #58A0C8; /* Azul Claro */
            --c4: #FDF5AA; /* Amarelo Solar */
        }
        
        body { 
            background-color: var(--c1); 
            color: #e0e0e0; 
            font-family: 'Lato', sans-serif; /* Texto corrido mais legível */
            min-height: 100vh; 
            background-image: radial-gradient(circle at top, #1a4f7a 0%, var(--c1) 60%);
        }
        
        /* Container Principal (A Página do Grimório) */
        .content-container {
            background: rgba(17, 63, 103, 0.95);
            border: 1px solid var(--c3);
            border-top: 4px solid var(--c4); /* Detalhe dourado no topo */
            border-radius: 4px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-width: 900px;
            margin: 40px auto;
            position: relative;
        }

        /* --- TIPOGRAFIA SOLAR (Onde a mágica acontece) --- */
        
        /* Título Principal (H1) */
        #content h1 {
            font-family: 'Cinzel', serif;
            color: var(--c4);
            text-align: center;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(253, 245, 170, 0.3);
            border-bottom: 2px solid var(--c2);
            padding-bottom: 20px;
        }

        /* Subtítulos (H2, H3) */
        #content h2, #content h3 {
            font-family: 'Cinzel', serif;
            color: var(--c3);
            margin-top: 30px;
            margin-bottom: 15px;
            border-left: 4px solid var(--c4);
            padding-left: 15px;
            background: linear-gradient(90deg, rgba(52, 105, 154, 0.2) 0%, transparent 100%);
        }

        #content h2 { font-size: 1.8rem; color: var(--c4); }
        #content h3 { font-size: 1.4rem; }

        /* Destaques em Negrito (Status, Palavras-chave) */
        #content strong {
            color: var(--c4);
            font-weight: 700;
        }

        /* Imagens no Markdown */
        #content img {
            display: block;
            max-width: 100%; 
            height: auto; 
            border-radius: 4px; 
            border: 1px solid var(--c3);
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            margin: 30px auto;
        }

        /* Citações (Blockquotes) - Lore */
        #content blockquote {
            font-style: italic;
            color: var(--c3);
            border-left: 3px solid var(--c2);
            margin: 20px 0;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.2);
        }

        /* Listas */
        #content ul { margin-bottom: 20px; padding-left: 20px; }
        #content li { margin-bottom: 8px; line-height: 1.6; }
        #content li::marker { color: var(--c4); } /* Bolinha dourada */

        /* Linhas Horizontais */
        #content hr { border-color: var(--c3); opacity: 0.3; margin: 40px 0; }

        /* Links dentro do texto */
        #content a { color: var(--c4); text-decoration: none; border-bottom: 1px dotted var(--c4); transition: 0.3s; }
        #content a:hover { color: #fff; text-shadow: 0 0 5px var(--c4); }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="container mt-4">
        <a href="javascript:history.back()" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>

    <div id="content" class="content-container">
        <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/loader.js"></script>
</body>
</html>
