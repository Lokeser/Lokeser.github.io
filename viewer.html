<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergaminho</title>
    <!-- Aplica o tema salvo antes da renderização (evita "flash") -->
    <script>(function(){var m=document.cookie.match(/(?:^|; )theme=([^;]+)/),v=m?decodeURIComponent(m[1]):'';if(v==='blue')v='light';if(v==='dark'||v==='light')document.documentElement.setAttribute('data-theme',v);})();</script>
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ---- Ficha de grimório: leitura ao centro, índice à direita ---- */
        .scroll-wrap {
            display: grid; grid-template-columns: minmax(0, 1fr) 210px;
            gap: var(--sp-7); align-items: start;
            padding: var(--sp-5) 0 var(--sp-8);
        }
        @media (max-width: 960px) { .scroll-wrap { grid-template-columns: 1fr; } }

        .trilha {
            display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
            font-size: var(--step--1); color: var(--text-2);
            padding: var(--sp-4) 0 var(--sp-3);
        }
        .trilha a { color: var(--text-2); text-decoration: none; }
        .trilha a:hover { color: var(--royal); }
        .trilha .sep { opacity: .45; }
        .trilha .atual { color: var(--text); font-weight: 600; }

        /* A página do pergaminho */
        .pergaminho {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow);
            padding: clamp(22px, 4vw, 56px);
            position: relative;
            overflow: hidden;
        }
        /* Fio dourado no topo — a borda iluminada da página */
        .pergaminho::before {
            content: ''; position: absolute; inset: 0 0 auto 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .pergaminho .prose { max-width: none; }
        .pergaminho .prose > h1:first-child {
            font-size: var(--step-3); text-align: center;
            letter-spacing: .06em; margin-bottom: var(--sp-5);
            padding-bottom: var(--sp-4);
            border-bottom: 1px solid var(--border);
        }

        /* ---- Lâminas arcanas ----
           Os .md trazem blocos ilustrados escritos para fundo escuro.
           No tema claro eles viram placas embutidas, como a estampa de
           um livro: a arte do autor fica intacta e sempre legível. */
        .lux-plate {
            background: #0D1424;
            border: 1px solid #2A3B56;
            border-radius: var(--r);
            padding: var(--sp-4);
            margin-block: var(--sp-4);
        }
        .lux-plate :where(h1,h2,h3,h4,strong) { color: #F4F0E6; }
        :root[data-theme="dark"] .lux-plate { background: var(--surface-inset); }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .lux-plate { background: var(--surface-inset); }
        }

        /* ---- Índice da página ---- */
        .indice { position: sticky; top: 86px; }
        @media (max-width: 960px) {
            .indice { position: static; order: -1; }
            .indice nav { display: flex; flex-wrap: wrap; gap: 6px; }
            .indice a { border-left: 0 !important; border: 1px solid var(--border); border-radius: var(--r-pill); }
        }
        .indice .idx-title {
            font-family: var(--font-ui); font-size: var(--step--1); font-weight: 600;
            letter-spacing: .16em; text-transform: uppercase; color: var(--gold);
            margin-bottom: var(--sp-3);
        }
        .indice a {
            display: block; padding: 6px 11px; margin-bottom: 2px;
            color: var(--text-2); text-decoration: none; font-size: var(--step--1);
            border-left: 2px solid var(--border); line-height: 1.4;
            transition: all var(--t) var(--ease);
        }
        .indice a:hover, .indice a.ativo { color: var(--royal); border-left-color: var(--royal); background: var(--royal-soft); }
        .indice a.nivel-3 { padding-left: 22px; font-size: .76rem; }

        .acoes-rodape {
            display: flex; gap: var(--sp-3); flex-wrap: wrap;
            margin-top: var(--sp-6); padding-top: var(--sp-5);
            border-top: 1px solid var(--border);
        }
        .carregando { display: grid; gap: var(--sp-3); }
        .carregando div { height: 14px; }
        .erro-box { text-align: center; padding: var(--sp-7) var(--sp-4); }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="lux-wrap">
        <nav class="trilha" id="trilha" aria-label="Trilha de navegação">
            <a href="/">Grimório</a>
        </nav>

        <div class="scroll-wrap">
            <article class="pergaminho">
                <div id="content" class="prose">
                    <div class="carregando" aria-live="polite" aria-busy="true">
                        <div class="skeleton" style="width:55%;height:30px"></div>
                        <div class="skeleton" style="width:100%"></div>
                        <div class="skeleton" style="width:92%"></div>
                        <div class="skeleton" style="width:78%"></div>
                    </div>
                </div>

                <div class="acoes-rodape">
                    <button class="btn btn--secondary" onclick="history.back()">← Voltar</button>
                    <a class="btn btn--ghost" href="#" id="link-secao">Ver a seção inteira</a>
                </div>
            </article>

            <aside class="indice" id="indice" hidden>
                <p class="idx-title">Nesta página</p>
                <nav id="indice-nav" aria-label="Índice da página"></nav>
            </aside>
        </div>
    </div>

    <footer class="lux-footer">
        <p>Luxsandoria — sistema de autoria de <strong>Lokeser</strong></p>
    </footer>

    <script src="js/menu.js"></script>
    <script src="js/loader.js"></script>
</body>
</html>
